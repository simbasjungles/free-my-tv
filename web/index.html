<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>ECK TV</title>
<style>
#eck-boot { position:fixed; left:0; top:0; width:100%; height:100%; background:#080e1c; color:white; z-index:100; text-align:center; font-family:Arial,sans-serif; }
#eck-boot div { position:absolute; left:50%; top:50%; width:300px; height:230px; margin:-115px 0 0 -150px; }
#eck-boot img { width:160px; height:160px; display:block; margin:0 auto 20px; }
#eck-boot strong { font-size:32px; letter-spacing:3px; }
</style>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="eck.css">
</head>
<body>
<div id="eck-boot" role="status" aria-label="ECK TV açılıyor"><div><img src="icons/eck-brand.png" alt=""><strong>ECK TV</strong></div></div>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="citypick" class="layer sheet"><div class="box"></div></div>
  <div id="keypick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="dim" class="layer"></div>
  <div id="ambient" class="layer"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script>if (!window.CONFIG || !CONFIG.eckHome) document.getElementById('eck-boot').style.display = 'none';</script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
<script src="eck-core.js"></script>
<script src="eck-home.js"></script>
</body>
</html>
