# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# true opens the picks in Stremio (com.stremio.one), on the title's own page, when it's installed. The picks stay the
# same: only titles on the streaming apps the TV has (and not in hide_services).
open_in_stremio=false

# Optional: YouTube channel ids (UC..., from the channel's "Share channel" > "Copy channel ID"), comma separated, for the
# YouTube tab. It shows their newest videos from YouTube's public RSS feeds (no key needed), the channels you open most
# first, and opens them in the YouTube app on your shelf (YouTube or SmartTube). Empty = categories picked on the TV
# (none picked: no tab).
# The tab is off until turned on: Free My TV > Home Settings > Picks > YouTube tab (OK there picks the categories).
youtube_channels=

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# Home screen look: auto (dark from sunset to sunrise), light or dark
theme=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# false keeps the TV's own screensaver (Free My TV then changes only the home screen and the promo apps)
screensaver=true

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay,
# now, kinopoisk, premier, amediateka, wink, ard, zdf, arte, joyn, rtl, wow, magenta.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say).
# The same switches are in Home Settings (Picks › Picks from); this is where they start, and what you switch on the TV wins.
hide_services=

# LG and Samsung: apps to leave out of the shelf, All Apps and the picks, comma separated, by id or name (part of it,
# any case). For apps the TV ships that can't be uninstalled, like Samsung's built-in Netflix: hide_apps=netflix
hide_apps=

# LG and Samsung: the shelf's apps in this order, comma separated, by id or name (part of it, any case), in place of
# the built-in order. Changing it here wins once over the shelf picked on the TV. On Samsung, a whole app id also
# brings an app the TV leaves out of its list (one installed in Developer Mode): shelf_apps=youtube,netflix,spotify
shelf_apps=

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=

# LG and Samsung: true opens the home screen with the drawer already out (apps in the middle, inputs, weather and
# prices below), so nothing has to be scrolled to reach the inputs. Back closes it to the full page.
drawer_first=false

# Optional: your Plex server's newest movies and shows join the picks (and open Plex on the title). In Plex's web app,
# open an item > ... > Get Info > View XML: plex_url is the address up to the port, the 192-168-1-20.<id>.plex.direct:32400
# one (https; it has a valid certificate; any other address is ignored), and plex_token is what follows X-Plex-Token=
# in it. Keep the token private, and prefer a Plex Home managed user's: any app on the TV can read the APK.
plex_url=
plex_token=

# Optional: Trakt (trakt.tv). With your own free API app (trakt.tv > Settings > Your API Apps > New Application;
# Redirect uri: urn:ietf:wg:oauth:2.0:oob, whose "insecure" warning doesn't apply to signing in with a code), Home
# Settings > Picks gets a Trakt row: sign in there with a code, and the picks leave out what you've watched and bring
# in your watchlist. Only the Client ID is needed (no secret goes into the APK).
# Free accounts connect one app at a time.
trakt_client_id=

# Optional: your Immich server (immich.app), as http://<its address>:2283 on your network or https://... On each TV you
# send its key to, My Photos (the screensaver, and the home screen's background without picks) is a fresh random choice
# of your Immich photos every 6 hours; Home Settings > My Photos picks all of them or one album. In plain http:// it
# must be on your own network (a private address, or a .local, .lan or .home.arpa name); everything else stays HTTPS.
# The key (Immich > Account Settings > API Keys: asset.read, asset.view, asset.download and album.read) doesn't go here,
# where it would end up in the app: send it with python3 tools/send_key.py <TV IP> immich_api_key (Android 9 and newer).
immich_server=
